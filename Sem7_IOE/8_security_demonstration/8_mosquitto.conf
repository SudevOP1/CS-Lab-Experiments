# run: mosquitto -c 8_mosquitto.conf -v
#
# certificates (CN of server.crt must be the broker hostname/ip, e.g. localhost):
#   openssl genrsa -out ca.key 2048
#   openssl req -x509 -new -nodes -key ca.key -sha256 -days 365 -out ca.crt
#   openssl genrsa -out server.key 2048
#   openssl req -new -key server.key -out server.csr
#   openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 365 -sha256
#
# users:
#   mosquitto_passwd -c passwd esp32      (password: esp32pass)
#
# acl file contents (only esp32 may use ioe/security/#):
#   user esp32
#   topic readwrite ioe/security/#

per_listener_settings true

# baseline, unsecured
listener 1883
allow_anonymous true

# secure, tls + username/password + acl
listener 8883
cafile ca.crt
certfile server.crt
keyfile server.key
allow_anonymous false
password_file passwd
acl_file acl
