# run: mosquitto -c 9_mosquitto.conf -v
#
# users:
#   mosquitto_passwd -c passwd campus-node
#   mosquitto_passwd passwd campus-app
#   mosquitto_passwd passwd nodered
#
# acl file contents:
#   user campus-node
#   topic write ioe/exp9/campus/sensor
#
#   user campus-app
#   topic readwrite ioe/exp9/campus/sensor
#   topic write ioe/exp9/campus/status
#   topic write ioe/exp9/campus/alert
#
#   user nodered
#   topic readwrite ioe/exp9/campus/#
#
# for tls, add cafile/certfile/keyfile and use port 8883 (see exp 8)

listener 1883
allow_anonymous false
password_file passwd
acl_file acl
